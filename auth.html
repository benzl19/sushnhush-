<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SushnHush - Authentication</title>
    <link rel="stylesheet" href="style-global.css">
</head>
<body>
    <div class="container">
        <div class="auth-gate" id="authGate" style="display: block; opacity: 1;">
            <svg class="svg-logo-small" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <line x1="40" y1="20" x2="30" y2="80" class="shh-line" />
                <line x1="60" y1="20" x2="50" y2="80" class="shh-line" />
                <line x1="20" y1="50" x2="80" y2="50" class="shh-cross" />
            </svg>
            
            <div class="auth-tabs">
                <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')"></button>
                <button class="tab-btn" id="tabRegister" onclick="switchTab('register')"></button>
            </div>
            
            <div id="formLogin" class="show-node">
                <input type="text" id="loginUser" class="input-field">
                <div class="password-wrapper">
                    <input type="password" id="loginPass" class="input-field" autocomplete="current-password">
                    <button type="button" class="toggle-pass" onclick="togglePassword('loginPass', this)"></button>
                </div>
                <button class="btn-submit" id="btnLoginSubmit" onclick="simulasiLogin()"></button>
                <p class="forgot-link" id="loginForgot" onclick="trigger3Blok()"></p>
            </div>
            
            <div id="formRegister" class="hide-node">
                <input type="text" id="regUser" class="input-field" autocomplete="off" oninput="cekPassword()">
                <p class="error-text" id="userTakenText"></p>
                <input type="email" id="regEmail" class="input-field" autocomplete="email" oninput="cekPassword()">
                
                <div class="password-wrapper">
                    <input type="password" id="regPass" class="input-field" autocomplete="new-password" oninput="cekPassword()">
                    <button type="button" class="toggle-pass" onclick="togglePassword('regPass', this)"></button>
                </div>

                <div class="password-wrapper">
                    <input type="password" id="regPassConfirm" class="input-field" autocomplete="new-password" oninput="cekPassword()">
                    <button type="button" class="toggle-pass" onclick="togglePassword('regPassConfirm', this)"></button>
                </div>
                
                <p class="error-text" id="passMismatchText"></p>
                <p class="helper-text" id="passHelperText"></p>
                
                <div class="divider-text" id="reg3BlockTitle"></div>
                <input type="text" id="regQ" class="input-field" autocomplete="off">
                <input type="text" id="regClue" class="input-field" autocomplete="off">
                <input type="password" id="regAns" class="input-field" autocomplete="off">
                
                <button class="btn-submit" id="btnRegSubmit" onclick="simulasiRegister()" disabled></button>
            </div>
        </div>
    </div>

    <script src="app-global.js"></script>
    <script>
        const kontenBahasaLokal = {
            'ID': {
                tabL: 'Masuk', tabR: 'Daftar Akun',
                loginUserPlaceholder: 'Username / Email...', loginPassPlaceholder: 'Password...', loginSubmit: 'Masuk Gerbang', loginForgot: 'Lupa Password? (Gunakan 3 Blok)',
                regUserPlaceholder: 'Username...', regEmailPlaceholder: 'Email Aktif...', regPassPlaceholder: 'Password...', passHelper: '*Password terdiri dari minimal 6 karakter gabungan antara angka dan huruf.',
                reg3BlockTitle: 'Keamanan 3 Blok (Anti-Lupa)', regQPlaceholder: '1. Buat Pertanyaan Rahasia (Cth: Kucing pertama?)...', regCluePlaceholder: '2. Clue Jawaban (Cth: Warna Oren)...', regAnsPlaceholder: '3. Jawaban Rahasia (Akan di-hash)...', regSubmit: 'Daftar & Acak Nama Samaran',
                passShow: 'LIHAT', passHide: 'TUTUP', userTaken: 'Username sudah digunakan!'
            },
            'EN': {
                tabL: 'Sign In', tabR: 'Register',
                loginUserPlaceholder: 'Username / Email...', loginPassPlaceholder: 'Password...', loginSubmit: 'Enter the Gate', loginForgot: 'Forgot Password? (Use 3 Blocks)',
                regUserPlaceholder: 'Username...', regEmailPlaceholder: 'Active Email...', regPassPlaceholder: 'Password...', passHelper: '*Password must be at least 6 characters containing both letters and numbers.',
                reg3BlockTitle: '3-Block Security (Anti-Forget)', regQPlaceholder: '1. Secret Question (Ex: First pet?)...', regCluePlaceholder: '2. Answer Clue (Ex: Orange color)...', regAnsPlaceholder: '3. Secret Answer (Will be hashed)...', regSubmit: 'Register & Randomize Alias',
                passShow: 'SHOW', passHide: 'HIDE', userTaken: 'Username is already taken!'
            }
        };

        window.addEventListener('load', function() {
            let lang = localStorage.getItem('sush_lang');
            if (!lang || (lang !== 'ID' && lang !== 'EN')) {
                lang = 'ID';
                localStorage.setItem('sush_lang', 'ID');
            }
            
            const data = kontenBahasaLokal[lang];
            
            document.getElementById('tabLogin').innerText = data.tabL; 
            document.getElementById('tabRegister').innerText = data.tabR;
            document.getElementById('loginUser').placeholder = data.loginUserPlaceholder; 
            document.getElementById('loginPass').placeholder = data.loginPassPlaceholder;
            document.getElementById('btnLoginSubmit').innerText = data.loginSubmit; 
            document.getElementById('loginForgot').innerText = data.loginForgot;
            document.getElementById('regUser').placeholder = data.regUserPlaceholder; 
            document.getElementById('regEmail').placeholder = data.regEmailPlaceholder;
            document.getElementById('regPass').placeholder = data.regPassPlaceholder; 
            document.getElementById('regPassConfirm').placeholder = lang === 'ID' ? 'Ulangi Password...' : 'Repeat Password...';
            document.getElementById('passMismatchText').innerText = lang === 'ID' ? 'Password tidak sama!' : 'Passwords do not match!';
            document.getElementById('passHelperText').innerText = data.passHelper; 
            document.getElementById('reg3BlockTitle').innerText = data.reg3BlockTitle;
            document.getElementById('regQ').placeholder = data.regQPlaceholder; 
            document.getElementById('regClue').placeholder = data.regCluePlaceholder;
            document.getElementById('regAns').placeholder = data.regAnsPlaceholder; 
            document.getElementById('btnRegSubmit').innerText = data.regSubmit;
            document.getElementById('userTakenText').innerText = data.userTaken;

            const btnsToggle = document.querySelectorAll('.toggle-pass');
            btnsToggle.forEach(b => { b.innerText = data.passShow; });
        });

        function switchTab(tab) {
            const loginForm = document.getElementById('formLogin'); 
            const regForm = document.getElementById('formRegister');
            const tabL = document.getElementById('tabLogin'); 
            const tabR = document.getElementById('tabRegister');
            
            if (tab === 'login') { 
                loginForm.classList.replace('hide-node', 'show-node'); 
                regForm.classList.replace('show-node', 'hide-node'); 
                tabL.classList.add('active'); 
                tabR.classList.remove('active'); 
            } else { 
                regForm.classList.replace('hide-node', 'show-node'); 
                loginForm.classList.replace('show-node', 'hide-node'); 
                tabR.classList.add('active'); 
                tabL.classList.remove('active'); 
                cekPassword();
            }
        }

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const lang = localStorage.getItem('sush_lang') || 'ID';
            const data = kontenBahasaLokal[lang];
            if (input.type === 'password') { 
                input.type = 'text'; 
                btn.innerText = data.passHide; 
            } else { 
                input.type = 'password'; 
                btn.innerText = data.passShow; 
            }
        }

        function cekPassword() {
            const user = document.getElementById('regUser').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const p1 = document.getElementById('regPass').value;
            const p2 = document.getElementById('regPassConfirm').value;
            const err = document.getElementById('passMismatchText');
            const btn = document.getElementById('btnRegSubmit');
            
            if (p2 === "") { err.style.display = 'none'; btn.disabled = true; return; }
            if (p1 !== p2) { 
                err.style.display = 'block'; btn.disabled = true; 
            } else { 
                err.style.display = 'none'; 
                if(user !== "" && email !== "" && p1.length >= 6) { btn.disabled = false; } else { btn.disabled = true; }
            }
        }

        async function simulasiRegister() {
            const userValue = document.getElementById('regUser').value.trim(); 
            const emailValue = document.getElementById('regEmail').value.trim(); 
            const passValue = document.getElementById('regPass').value;
            const qValue = document.getElementById('regQ').value.trim();
            const clueValue = document.getElementById('regClue').value.trim();
            const ansValue = document.getElementById('regAns').value.trim();
            
            const passwordPattern = /^(?=.*[a-zA-Z])(?=.*\d).{6,}$/; 
            const invalidUserPattern = /[@]/;
            const lang = localStorage.getItem('sush_lang') || 'ID';
            
            const errUserTaken = document.getElementById('userTakenText');
            if (errUserTaken) errUserTaken.style.display = 'none';
            
            if(!userValue || !emailValue) {
                alert(lang === 'ID' ? "Username dan Email wajib diisi!" : "Username and Email are required!");
                return;
            }

            if (invalidUserPattern.test(userValue)) {
                alert(lang === 'ID' ? "Akses Ditolak: Username tidak boleh mengandung simbol '@' atau menyerupai format email!" : "Access Denied: Username must not contain the '@' symbol or resemble an email format!");
                return;
            }
            
            if (!passwordPattern.test(passValue)) {
                alert(lang === 'ID' ? "Akses Ditolak: Password harus terdiri dari minimal 6 karakter dan merupakan gabungan huruf serta angka!" : "Access Denied: Password must be at least 6 characters and contain both letters and numbers!");
                return;
            }

            if (!qValue || !ansValue) {
                alert(lang === 'ID' ? "Pertanyaan dan Jawaban Rahasia wajib diisi untuk perlindungan 3 Blok!" : "Secret Question and Answer are required for 3-Block security!");
                return;
            }
            
            try {
                const urlCekUser = SUPABASE_URL + '/rest/v1/users?username=eq.' + encodeURIComponent(userValue);
                const resCekUser = await fetch(urlCekUser, { method: 'GET', headers: reqHeaders });
                const dataCekUser = await resCekUser.json();
                
                if (dataCekUser && dataCekUser.length > 0) {
                    if (errUserTaken) errUserTaken.style.display = 'block';
                    return;
                }

                const urlCek = SUPABASE_URL + '/rest/v1/users?email=eq.' + encodeURIComponent(emailValue);
                const resCek = await fetch(urlCek, { method: 'GET', headers: reqHeaders });
                const dataCek = await resCek.json();
                
                if (dataCek && dataCek.length > 0) {
                    alert(lang === 'ID' ? "Akses Ditolak: Email ini sudah terdaftar di sistem SUSHNHUSH!" : "Access Denied: This email is already registered!");
                    return;
                }
                
                const newAlias = `${anonNouns[Math.floor(Math.random() * anonNouns.length)]}#${generateSecretPin()}`;
                
                const urlPost = SUPABASE_URL + '/rest/v1/users';
                const postHeaders = Object.assign({}, reqHeaders, { 'Prefer': 'return=representation' });
                const resPost = await fetch(urlPost, {
                    method: 'POST',
                    headers: postHeaders,
                    body: JSON.stringify({ 
                        username: userValue, 
                        email: emailValue, 
                        global_alias: newAlias, 
                        password: passValue,
                        secret_question: qValue,
                        secret_clue: clueValue,
                        secret_answer: ansValue
                    })
                });
                
                if (!resPost.ok) {
                    const errObj = await resPost.json();
                    alert("System Error: " + errObj.message);
                    return;
                }
                
                localStorage.setItem('sush_curUser', userValue); 
                localStorage.setItem('sush_curEmail', emailValue); 
                localStorage.setItem('sush_curAlias', newAlias);
                
                if (lang === 'ID') {
                    alert(`Registrasi Berhasil\n\nAkun Anda telah dibuat. Sistem mengacak nama samaran Anda menjadi: ${newAlias}`);
                } else {
                    alert(`Registration Successful\n\nAccount created. System randomized your alias to: ${newAlias}`);
                }
                
                window.location.href = 'beranda.html';
                
            } catch (err) {
                alert(lang === 'ID' ? "Koneksi ke server gagal: " + err.message : "Failed to connect to server: " + err.message);
            }
        }

        async function simulasiLogin() {
            const loginVal = document.getElementById('loginUser').value.trim();
            const passVal = document.getElementById('loginPass').value; 
            const lang = localStorage.getItem('sush_lang') || 'ID';
            
            if(!loginVal || !passVal) {
                alert(lang === 'ID' ? 'Username/Email dan Password wajib diisi!' : 'Username/Email and Password are required!');
                return;
            }

            try {
                const urlGet = SUPABASE_URL + '/rest/v1/users?or=(email.eq.' + encodeURIComponent(loginVal) + ',username.eq.' + encodeURIComponent(loginVal) + ')';
                const res = await fetch(urlGet, { method: 'GET', headers: reqHeaders });
                const data = await res.json();
                
                if (!data || data.length === 0) {
                    alert(lang === 'ID' ? 'Akses Ditolak: Kredensial tidak dikenali di sistem!' : 'Access Denied: Unrecognized Credentials!');
                    return;
                }
                
                if (data[0].password !== passVal) {
                    alert(lang === 'ID' ? 'Akses Ditolak: Password yang Anda masukkan salah!' : 'Access Denied: Incorrect Password!');
                    return;
                }
                
                localStorage.setItem('sush_curUser', data[0].username || 'Member'); 
                localStorage.setItem('sush_curEmail', data[0].email);
                localStorage.setItem('sush_curAlias', data[0].global_alias);
                
                if (lang === 'ID') {
                    alert(`Mencocokkan kredensial dengan database...\nBerhasil masuk ke SUSHNHUSH!`);
                } else {
                    alert(`Matching credentials with database...\nSuccessfully entered SUSHNHUSH!`);
                }
                
                window.location.href = 'beranda.html';
            } catch (err) {
                alert('System Error: ' + err.message);
            }
        }

        async function trigger3Blok() {
            const lang = localStorage.getItem('sush_lang') || 'ID';
            const inputUser = prompt(lang === 'ID' ? "Masukkan Email atau Username Anda:" : "Enter your Email or Username:");
            if (!inputUser) return;

            try {
                const urlGet = SUPABASE_URL + '/rest/v1/users?or=(email.eq.' + encodeURIComponent(inputUser) + ',username.eq.' + encodeURIComponent(inputUser) + ')';
                const res = await fetch(urlGet, { method: 'GET', headers: reqHeaders });
                const data = await res.json();

                if (!data || data.length === 0) {
                    alert(lang === 'ID' ? "Akun tidak ditemukan!" : "Account not found!");
                    return;
                }

                const user = data[0];
                if (!user.secret_question) {
                    alert(lang === 'ID' ? "Akun ini belum mengonfigurasi Keamanan 3 Blok." : "This account has not configured 3-Block Security.");
                    return;
                }

                const infoPertanyaan = lang === 'ID' 
                    ? `[KEAMANAN 3 BLOK]\n\nPertanyaan: ${user.secret_question}\nClue: ${user.secret_clue || '-'}\n\nMasukkan Jawaban Anda:`
                    : `[3-BLOCK SECURITY]\n\nQuestion: ${user.secret_question}\nClue: ${user.secret_clue || '-'}\n\nEnter your Answer:`;
                    
                const inputAns = prompt(infoPertanyaan);
                if (!inputAns) return;

                if (inputAns.trim().toLowerCase() !== String(user.secret_answer).trim().toLowerCase()) {
                    alert(lang === 'ID' ? "Jawaban salah! Akses pemulihan ditolak." : "Incorrect answer! Recovery access denied.");
                    return;
                }

                const infoPassBaru = lang === 'ID'
                    ? "Verifikasi Sukses!\n\nMasukkan Password Baru Anda\n(Minimal 6 karakter, gabungan huruf & angka):"
                    : "Verification Successful!\n\nEnter Your New Password\n(Minimum 6 characters, combining letters & numbers):";

                const passwordBaru = prompt(infoPassBaru);
                if (!passwordBaru) return;

                const passwordPattern = /^(?=.*[a-zA-Z])(?=.*\d).{6,}$/;
                if (!passwordPattern.test(passwordBaru)) {
                    alert(lang === 'ID' 
                        ? "Akses Ditolak: Password baru harus terdiri dari minimal 6 karakter dan merupakan gabungan huruf serta angka!" 
                        : "Access Denied: New password must be at least 6 characters and contain both letters and numbers!");
                    return;
                }

                const urlPatch = SUPABASE_URL + '/rest/v1/users?email=eq.' + encodeURIComponent(user.email);
                const resPatch = await fetch(urlPatch, {
                    method: 'PATCH',
                    headers: reqHeaders,
                    body: JSON.stringify({ password: passwordBaru })
                });

                if (!resPatch.ok) {
                    alert("System Error: Gagal memperbarui password di database.");
                    return;
                }


                alert(lang === 'ID'
                    ? "Password Anda berhasil diperbarui! Silakan masuk menggunakan password baru Anda."
                    : "Your password has been successfully updated! Please log in using your new password.");

            } catch (err) {
                alert("Error: " + err.message);
            }
        }

    </script>
</body>
    </html>
