<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retribution Contest - Fase 2</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* TEMA CYBERPUNK NEON */
        :root {
            --bg-color: #0b0c10; --text-color: #c5c6c7;
            --neon-cyan: #45f3ff; --neon-red: #ff4a4a;
            --neon-green: #39ff14; --dark-gray: #1f2833;
        }

        body {
            margin: 0; padding: 0; 
            background-color: var(--bg-color); color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden; width: 100vw; height: 100dvh; 
            display: flex; justify-content: center;
        }

        .container { 
            width: 100%; max-width: 420px; height: 100%; 
            position: relative; background-color: var(--bg-color); overflow: hidden;
        }

        /* ARSITEKTUR TRANSISI iOS */
        .view-panel {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; padding: 20px; box-sizing: border-box;
            background-color: var(--bg-color);
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.3s ease;
            transform: translateX(100%); opacity: 0; pointer-events: none; z-index: 1;
        }

        .view-panel.active { transform: translateX(0); opacity: 1; pointer-events: auto; z-index: 2; }
        .view-panel.slide-left { transform: translateX(-100%); opacity: 0; pointer-events: none; z-index: 1; }

        /* KOSMETIK ELEMEN */
        h1 { margin: 0; text-align: center; color: #fff; text-shadow: 0 0 10px var(--neon-cyan); margin-bottom: 20px; font-weight: 600; }
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .panel-box { background: rgba(31, 40, 51, 0.5); border: 1px solid var(--dark-gray); border-radius: 10px; padding: 15px; margin-bottom: 20px; }
        .leaderboard-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed var(--dark-gray); }
        
        button {
            background: transparent; border: 1px solid var(--neon-cyan); color: var(--neon-cyan);
            padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s; width: 100%; margin-bottom: 15px;
            box-shadow: 0 0 10px rgba(69, 243, 255, 0.2);
        }
        button:active { transform: scale(0.96); background: var(--neon-cyan); color: var(--bg-color); }
        .btn-small { padding: 8px 12px; font-size: 12px; width: auto; margin-bottom: 0; }
    </style>
</head>
<body>
    <div class="container">

        <div id="view-main" class="view-panel active">
            <div class="top-nav">
                <div style="color:#555; font-size:12px;">FASE 2</div>
                <button type="button" class="btn-small" onclick="window.location.href='beranda.html'">Kembali</button>
            </div>
            
            <h1>RETRIBUTION<br>CONTEST</h1>
            
            <div class="panel-box">
                <h3 style="margin-bottom:10px; color:var(--neon-cyan); text-align:center;">LEADERBOARD</h3>
                <div id="leaderboardList">
                    <div style="text-align:center; color:#555;">Mencari data...</div>
                </div>
            </div>

            <div style="text-align:center; margin-bottom: 15px; font-size: 14px;">
                Bermain sebagai: <span id="displayUsername" style="color: var(--neon-green); font-weight:bold;">Mendeteksi...</span>
            </div>

            <button type="button" onclick="transisiLayar('view-main', 'view-lobby')">Siap, Main</button>
        </div>


        <div id="view-lobby" class="view-panel">
            <div class="top-nav">
                <button type="button" class="btn-small" onclick="transisiLayar('view-lobby', 'view-main')">← Back</button>
                <div style="font-weight:bold; color:var(--neon-cyan);">LOBBY KOSONG</div>
                <div style="width: 60px;"></div>
            </div>

            <div class="panel-box" style="display: flex; flex-direction: column; justify-content: center; text-align: center; flex-grow: 1;">
                <h2 style="color: var(--neon-green); margin-bottom: 20px;">KONEKSI SUKSES</h2>
                <p style="font-size: 14px; color:#c5c6c7;">
                    Database B sudah diinisialisasi di latar belakang tanpa merusak navigasi.<br><br>
                    Silakan mundur kembali ke Menu Utama.
                </p>
            </div>
        </div>

    </div>
        <script>
        // ========================================================
        // 1. FUNGSI NAVIGASI VISUAL (TETAP SAMA SEPERTI FASE 1)
        // ========================================================
        function transisiLayar(idAsal, idTujuan) {
            const layarAsal = document.getElementById(idAsal);
            const layarTujuan = document.getElementById(idTujuan);

            if (!layarAsal || !layarTujuan) return;

            if (idAsal === 'view-main' && idTujuan === 'view-lobby') {
                layarAsal.classList.remove('active');
                layarAsal.classList.add('slide-left');
                layarTujuan.classList.remove('slide-left');
                layarTujuan.classList.add('active');
            } 
            else if (idAsal === 'view-lobby' && idTujuan === 'view-main') {
                layarAsal.classList.remove('active');
                layarTujuan.classList.remove('slide-left');
                layarTujuan.classList.add('active');
            }
        }

        // ========================================================
        // 2. SETUP IDENTITAS & DUAL CLOUD SUPABASE
        // ========================================================
        let supabaseA = null; // Disiapkan untuk koneksi langsung ke SUSHNHUSH (jika butuh)
        let supabaseB = null; // Koneksi mutlak untuk Retribution Room
        
        // Mengambil identitas dari penyimpanan lokal (Cloud A)
        const myUsername = localStorage.getItem('sush_curAlias') || 'Guest_' + Math.floor(Math.random() * 1000);

        try {
            if (window.supabase) {
                // Inisialisasi Cloud B (Server Singapura)
                const URL_B = 'https://znbyjoapajjonerfannn.supabase.co';
                const KEY_B = 'sb_publishable_ELkRTe17wW5hk7kR6mw3SA_jmq4L8fZ';
                supabaseB = window.supabase.createClient(URL_B, KEY_B);
                
                // Jika nanti Anda butuh menembak tabel di Cloud A, kita bisa inisialisasi supabaseA di sini.
            }
        } catch (e) {
            console.error("Gagal menghubungkan Supabase B:", e);
        }

        // ========================================================
        // 3. FUNGSI AMBIL DATA LEADERBOARD DENGAN AMAN
        // ========================================================
        async function ambilLeaderboard() {
            const wadahList = document.getElementById('leaderboardList');
            if (!supabaseB) {
                wadahList.innerHTML = '<div style="text-align:center; color:#ff4a4a;">Koneksi Database B Terputus</div>';
                return;
            }

            try {
                // Proses mengambil data dari Cloud B
                const { data, error } = await supabaseB.from('retri_leaderboard').select('*').order('wins', { ascending: false }).limit(5);
                
                if (error) throw error;

                if (data && data.length > 0) {
                    let html = '';
                    data.forEach((r, i) => {
                        html += `<div class="leaderboard-item"><span>#${i+1} ${r.username}</span><span>${r.wins} Win</span></div>`;
                    });
                    wadahList.innerHTML = html;
                } else {
                    wadahList.innerHTML = '<div style="text-align:center; color:#555;">Belum ada juara</div>';
                }
            } catch (err) {
                console.error("Error Leaderboard:", err);
                wadahList.innerHTML = '<div style="text-align:center; color:#ff4a4a;">Gagal Memuat Data.</div>';
            }
        }

        // ========================================================
        // 4. TRIGGER AMAN SETELAH DOM SELESAI DIGAMBAR
        // ========================================================
        window.addEventListener('DOMContentLoaded', () => {
            // Tampilkan identitas di UI
            document.getElementById('displayUsername').innerText = myUsername;
            
            // Muat leaderboard secara asinkron (tidak memblokir klik)
            ambilLeaderboard();
        });
    </script>
</body>
</html>
