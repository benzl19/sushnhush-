<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retribution Contest - Fase 3</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* TEMA CYBERPUNK NEON */
        :root {
            --bg-color: #0b0c10; --text-color: #c5c6c7;
            --neon-cyan: #45f3ff; --neon-red: #ff4a4a;
            --neon-green: #39ff14; --dark-gray: #1f2833;
        }

        body {
            margin: 0; padding: 0; 
            background-color: var(--bg-color); color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden; width: 100vw; height: 100dvh; 
            display: flex; justify-content: center;
        }

        .container { 
            width: 100%; max-width: 420px; height: 100%; 
            position: relative; background-color: var(--bg-color); overflow: hidden;
        }

        /* ARSITEKTUR TRANSISI iOS */
        .view-panel {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; padding: 20px; box-sizing: border-box;
            background-color: var(--bg-color);
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.3s ease;
            transform: translateX(100%); opacity: 0; pointer-events: none; z-index: 1;
        }

        .view-panel.active { transform: translateX(0); opacity: 1; pointer-events: auto; z-index: 2; }
        .view-panel.slide-left { transform: translateX(-100%); opacity: 0; pointer-events: none; z-index: 1; }

        /* KOSMETIK ELEMEN */
        h1 { margin: 0; text-align: center; color: #fff; text-shadow: 0 0 10px var(--neon-cyan); margin-bottom: 20px; font-weight: 600; }
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .panel-box { background: rgba(31, 40, 51, 0.5); border: 1px solid var(--dark-gray); border-radius: 10px; padding: 15px; margin-bottom: 20px; }
        .leaderboard-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed var(--dark-gray); }
        
        button {
            background: transparent; border: 1px solid var(--neon-cyan); color: var(--neon-cyan);
            padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s; width: 100%; margin-bottom: 15px;
            box-shadow: 0 0 10px rgba(69, 243, 255, 0.2);
        }
        button:active { transform: scale(0.96); background: var(--neon-cyan); color: var(--bg-color); }
        button:disabled { border-color: #555; color: #555; cursor: not-allowed; box-shadow: none; }
        
        .btn-red { border-color: var(--neon-red); color: var(--neon-red); box-shadow: 0 0 10px rgba(255, 74, 74, 0.2); }
        .btn-red:active { background: var(--neon-red); color: var(--bg-color); box-shadow: 0 0 20px var(--neon-red); }
        .btn-small { padding: 8px 12px; font-size: 12px; width: auto; margin-bottom: 0; }

        input[type="text"] {
            width: 100%; padding: 15px; background: transparent; border: 1px solid var(--dark-gray);
            color: #fff; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; text-align: center; font-size: 18px; letter-spacing: 2px;
        }
        input[type="text"]:focus { outline: none; border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(69, 243, 255, 0.3); }

        .versus-box { text-align: center; margin-bottom: 20px; }
        .player-name { font-size: 20px; color: #fff; }
        .vs-text { color: var(--neon-red); font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">

        <div id="view-main" class="view-panel active">
            <div class="top-nav">
                <div style="color:#555; font-size:12px;">FASE 3</div>
                <button type="button" class="btn-small" onclick="window.location.href='beranda.html'">Kembali</button>
            </div>
            
            <h1>RETRIBUTION<br>CONTEST</h1>
            
            <div class="panel-box">
                <h3 style="margin-bottom:10px; color:var(--neon-cyan); text-align:center;">LEADERBOARD</h3>
                <div id="leaderboardList">
                    <div style="text-align:center; color:#555;">Memuat data...</div>
                </div>
            </div>

            <div style="text-align:center; margin-bottom: 15px; font-size: 14px;">
                Bermain sebagai: <span id="displayUsername" style="color: var(--neon-green); font-weight:bold;">...</span>
            </div>

            <button type="button" onclick="transisiLayar('view-main', 'view-lobby', 'maju')">Siap, Main</button>
        </div>


        <div id="view-lobby" class="view-panel">
            <div class="top-nav">
                <button type="button" class="btn-small" onclick="transisiLayar('view-lobby', 'view-main', 'mundur')">← Back</button>
                <div style="font-weight:bold; color:var(--neon-cyan);">LOBBY</div>
                <div style="width: 60px;"></div>
            </div>

            <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center;">
                <button type="button" onclick="buatRoom()">Buat Room Baru</button>
                <div style="text-align: center; margin: 20px 0; color: #555;">- ATAU -</div>
                <input type="text" id="inputRoomId" placeholder="Masukkan ID Room" maxlength="10" autocomplete="off">
                <button type="button" class="btn-red" onclick="joinRoom()">Join Room</button>
            </div>
        </div>


        <div id="view-room" class="view-panel">
            <div class="top-nav">
                <button type="button" class="btn-small" id="btnLeaveRoom" onclick="tinggalkanRoom()">← Keluar</button>
                <div style="font-weight:bold; color:var(--neon-cyan);" id="displayRoomId">SH-0000</div>
                <button type="button" class="btn-small" onclick="salinRoomId()">Salin ID</button>
            </div>

            <div class="panel-box" style="display: flex; flex-direction: column; justify-content: center;">
                <div class="versus-box">
                    <div class="player-name" id="p1NameRoom">Pemain 1</div>
                    <div class="vs-text">VS</div>
                    <div class="player-name" id="p2NameRoom" style="color:#555;">Menunggu Lawan...</div>
                </div>
                <div style="text-align:center; margin-top:20px; font-weight:bold; color:var(--neon-cyan);" id="roomStatusText">
                    Menunggu pemain bergabung...
                </div>
            </div>

            <button type="button" id="btnReady" disabled>READY (Tahap Selanjutnya)</button>
        </div>

    </div>
        <script>
        // ========================================================
        // 1. FUNGSI NAVIGASI CERDAS (Maju & Mundur)
        // ========================================================
        function transisiLayar(idAsal, idTujuan, arah = 'maju') {
            const layarAsal = document.getElementById(idAsal);
            const layarTujuan = document.getElementById(idTujuan);
            if (!layarAsal || !layarTujuan) return;

            if (arah === 'maju') {
                layarAsal.classList.remove('active');
                layarAsal.classList.add('slide-left');
                layarTujuan.classList.remove('slide-left');
                layarTujuan.classList.add('active');
            } else {
                layarAsal.classList.remove('active');
                layarTujuan.classList.remove('slide-left');
                layarTujuan.classList.add('active');
            }
        }

        // ========================================================
        // 2. SETUP IDENTITAS & CLOUD B
        // ========================================================
        let supabaseB = null; 
        let roomChannel = null;
        let currentRoomId = null;
        let p1Name = '';
        let p2Name = '';
        let myRole = null;

        const myUsername = localStorage.getItem('sush_curAlias') || 'Guest_' + Math.floor(Math.random() * 1000);

        try {
            if (window.supabase) {
                const URL_B = 'https://znbyjoapajjonerfannn.supabase.co';
                const KEY_B = 'sb_publishable_ELkRTe17wW5hk7kR6mw3SA_jmq4L8fZ';
                supabaseB = window.supabase.createClient(URL_B, KEY_B);
            }
        } catch (e) {
            console.error("Gagal menghubungkan Supabase B:", e);
        }

        // ========================================================
        // 3. FUNGSI PEMBUATAN & GABUNG ROOM
        // ========================================================
        function generateRoomId() {
            return 'SH-' + Math.floor(1000 + Math.random() * 9000);
        }

        function updateRoomUI() {
            document.getElementById('displayRoomId').innerText = currentRoomId;
            document.getElementById('p1NameRoom').innerText = p1Name;
            
            if (p2Name) {
                document.getElementById('p2NameRoom').innerText = p2Name;
                document.getElementById('p2NameRoom').style.color = '#fff';
                document.getElementById('roomStatusText').innerText = 'Lawan telah masuk!';
            } else {
                document.getElementById('p2NameRoom').innerText = 'Menunggu Lawan...';
                document.getElementById('p2NameRoom').style.color = '#555';
                document.getElementById('roomStatusText').innerText = 'Menunggu pemain bergabung...';
            }
        }

        async function buatRoom() {
            if (!supabaseB) { alert('Sistem Database Terputus!'); return; }
            
            const btn = event.target;
            btn.innerText = 'Membuat...'; btn.disabled = true;

            const newId = generateRoomId();
            try {
                // Tembak ke Supabase B
                const { error } = await supabaseB.from('retri_rooms').insert([
                    { id: newId, p1_username: myUsername, status: 'waiting' }
                ]);
                
                if (error) throw error;

                // Sukses
                currentRoomId = newId; myRole = 'p1'; p1Name = myUsername; p2Name = '';
                updateRoomUI();
                transisiLayar('view-lobby', 'view-room', 'maju');
                subscribeKeRoom(newId);

            } catch (err) {
                alert('Gagal membuat room: ' + err.message);
            } finally {
                btn.innerText = 'Buat Room Baru'; btn.disabled = false;
            }
        }

        async function joinRoom() {
            if (!supabaseB) { alert('Sistem Database Terputus!'); return; }
            
            const inputElement = document.getElementById('inputRoomId');
            const inputId = inputElement.value.trim().toUpperCase();
            if (!inputId) { alert('Masukkan ID Room dulu!'); return; }

            const btn = event.target;
            btn.innerText = 'Mencari...'; btn.disabled = true;

            try {
                // Cari data room
                const { data, error: fetchErr } = await supabaseB.from('retri_rooms').select('*').eq('id', inputId).single();
                if (fetchErr || !data) throw new Error('Room tidak ditemukan!');
                if (data.p2_username) throw new Error('Room sudah penuh!');

                // Update room dengan nama kita
                const { error: updateErr } = await supabaseB.from('retri_rooms').update({ 
                    p2_username: myUsername, status: 'full' 
                }).eq('id', inputId);
                
                if (updateErr) throw updateErr;

                // Sukses masuk
                currentRoomId = inputId; myRole = 'p2'; 
                p1Name = data.p1_username; p2Name = myUsername;
                
                updateRoomUI();
                transisiLayar('view-lobby', 'view-room', 'maju');
                subscribeKeRoom(inputId);

            } catch (err) {
                alert(err.message);
            } finally {
                btn.innerText = 'Join Room'; btn.disabled = false;
                inputElement.value = ''; // Bersihkan input
            }
        }

        function salinRoomId() {
            if (!currentRoomId) return;
            navigator.clipboard.writeText(currentRoomId);
            alert('ID Disalin: ' + currentRoomId);
        }

        function tinggalkanRoom() {
            if (roomChannel && supabaseB) supabaseB.removeChannel(roomChannel);
            currentRoomId = null; p1Name = ''; p2Name = ''; myRole = null;
            transisiLayar('view-room', 'view-lobby', 'mundur');
        }

        // ========================================================
        // 4. SUPABASE REALTIME LISTENER (DETEKSI LAWAN)
        // ========================================================
        function subscribeKeRoom(roomId) {
            if (!supabaseB) return;
            if (roomChannel) supabaseB.removeChannel(roomChannel);
            
            roomChannel = supabaseB.channel('room_' + roomId)
            .on(
                'postgres_changes', 
                { event: 'UPDATE', schema: 'public', table: 'retri_rooms', filter: 'id=eq.' + roomId }, 
                (payload) => {
                    const newData = payload.new;
                    // Jika ada p2_username masuk dan kita belum tau
                    if (newData.p2_username && !p2Name) { 
                        p2Name = newData.p2_username; 
                        updateRoomUI(); 
                    }
                }
            ).subscribe();
        }

        // ========================================================
        // 5. LEADERBOARD (WARISAN FASE 2)
        // ========================================================
        async function ambilLeaderboard() {
            if (!supabaseB) return;
            try {
                const { data, error } = await supabaseB.from('retri_leaderboard').select('*').order('wins', { ascending: false }).limit(5);
                if (error) throw error;
                if (data && data.length > 0) {
                    let html = '';
                    data.forEach((r, i) => {
                        html += `<div class="leaderboard-item"><span>#${i+1} ${r.username}</span><span>${r.wins} Win</span></div>`;
                    });
                    document.getElementById('leaderboardList').innerHTML = html;
                } else {
                    document.getElementById('leaderboardList').innerHTML = '<div style="text-align:center; color:#555;">Belum ada juara</div>';
                }
            } catch (err) {
                document.getElementById('leaderboardList').innerHTML = '<div style="text-align:center; color:#555;">Gagal Memuat Data.</div>';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('displayUsername').innerText = myUsername;
            ambilLeaderboard();
        });
    </script>
</body>
</html>
