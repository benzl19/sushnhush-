<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SushnHush - Select Language</title>
    <link rel="stylesheet" href="style-global.css">
</head>
<body>
    <div class="container">
        <div class="language-gate" id="langGate">
            <svg class="svg-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <line x1="40" y1="20" x2="30" y2="80" class="shh-line" />
                <line x1="60" y1="20" x2="50" y2="80" class="shh-line" />
                <line x1="20" y1="50" x2="80" y2="50" class="shh-cross" />
            </svg>
            <div class="brand-name">SUSHNHUSH</div>
            <button class="btn-lang" onclick="pilihBahasaSistem('ID')">[ ID ] Bahasa Indonesia</button>
            <button class="btn-lang" onclick="pilihBahasaSistem('EN')">[ EN ] English</button>
        </div>
    </div>
    <script src="app-global.js"></script>
    <script>
        function pilihBahasaSistem(lang) {
            localStorage.setItem('sush_lang', lang);
            if (typeof navigasiKeHalaman === 'function') {
                navigasiKeHalaman('landing-pages.html', 'slide-out-left');
            } else {
                window.location.href = 'landing-pages.html';
            }
        }
    </script>
</body>
</html>
