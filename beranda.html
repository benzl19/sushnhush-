<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SushnHush - Main Hub</title>
    <link rel="stylesheet" href="style-global.css">
    <style>
        /* Gaya Tombol Games Neon Terisolasi */
        .btn-games-nav {
            background: transparent;
            border: 1px solid #45f3ff;
            color: #45f3ff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 0 8px rgba(69, 243, 255, 0.2);
            margin-left: 10px;
            display: inline-block;
        }
        .btn-games-nav:active {
            transform: scale(0.95);
            background: #45f3ff;
            color: #0b0c10;
            box-shadow: 0 0 15px #45f3ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-hub show-flex fade-in" id="mainHub" style="display: flex; opacity: 1; transform: translateX(0);">
            
            <div class="hub-header">
                <h2 class="hub-title" onclick="if(typeof toggleMenuPanel === 'function') toggleMenuPanel('notif')">
                    <svg class="svg-logo-hub" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <line x1="40" y1="20" x2="30" y2="80" class="shh-line" />
                        <line x1="60" y1="20" x2="50" y2="80" class="shh-line" />
                        <line x1="20" y1="50" x2="80" y2="50" class="shh-cross" />
                    </svg>
                    <span>SUSHNHUSH</span><span id="titleBadge" class="neon-dot" style="display:none; margin-left:2px;">°</span>
                </h2>
                
                <!-- Tombol Games Berhasil Disisipkan -->
                <button class="btn-games-nav" onclick="window.location.href='retri.html'">[ GAMES ]</button>

                <!-- Mengembalikan grup tombol asli agar initBeranda() tidak error -->
                <div class="hub-nav-group">
                    <button class="nav-btn" id="navBtnProfile" onclick="if(typeof toggleMenuPanel === 'function') toggleMenuPanel('profile')"></button>
                    <button class="nav-btn" id="navBtnList" onclick="if(typeof toggleMenuPanel === 'function') toggleMenuPanel('list')"></button>
                    <button class="nav-btn-action" id="navBtnAction" onclick="if(typeof toggleMenuPanel === 'function') toggleMenuPanel('action')">+</button>
                    <button class="btn-logout" id="btnLogout" onclick="logoutSistem()"></button>
                </div>
            </div>


            <div class="roll-down-panel" id="universalDropdown">
                <div class="roll-down-content" id="universalDropdownContent"></div>
            </div>

            <div class="section-title" style="margin-bottom: 15px;" id="titleRiwayat"></div>
            
            <div class="chat-list" id="hubChatList">
                <div class="empty-state" id="emptyChatText"></div>
            </div>

            <div class="hub-footer" style="margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding-top: 10px;">
                <div class="hub-nav-group" style="width: 100%; display: flex; justify-content: space-between;">
                    <button class="nav-btn" id="navBtnList" onclick="if(typeof toggleMenuPanel === 'function') toggleMenuPanel('list')"></button>
                    <button class="nav-btn-action" id="navBtnAction" onclick="if(typeof toggleMenuPanel === 'function') toggleMenuPanel('action')">+</button>
                    <button class="btn-logout" id="btnLogout" onclick="logoutSistem()"></button>
                </div>
            </div>

        </div>
    </div> 

    <div class="modal-overlay" id="modalCreate">
        <div class="modal-box">
            <h3 class="modal-title" id="mCreateTitle"></h3>
            <p class="modal-text" id="mCreateDesc"></p>
            <input type="text" id="groupNameInput" class="input-field" placeholder="Nama Grup (Maks 15 Karakter)..." maxlength="15" autocomplete="off">
            <input type="password" id="groupPassInput" class="input-field" placeholder="Password Masuk Grup..." autocomplete="new-password">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="tutupModal('modalCreate')" id="mCreateCancel"></button>
                <button class="btn-confirm" onclick="prosesBuatGrup()" id="mCreateConfirm"></button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalJoin">
        <div class="modal-box">
            <h3 class="modal-title" id="mJoinTitle"></h3>
            <p class="modal-text" id="mJoinDesc"></p>
            <input type="password" id="joinPassInput" class="input-field" placeholder="Password Grup..." autocomplete="new-password">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="tutupModal('modalJoin')" id="mJoinCancel"></button>
                <button class="btn-confirm" onclick="prosesKetukPintu('ya')" id="mJoinConfirm"></button>
            </div>
        </div>
    </div>

    <script src="app-global.js"></script>
    <script>
        window.addEventListener('load', function() {
            if (!localStorage.getItem('sush_curEmail')) {
                window.location.href = 'index.html';
                return;
            }
            if (typeof initBeranda === "function") {
                initBeranda();
            }
        });
    
        function initBeranda() {
            var lang = localStorage.getItem('sush_lang');
            if (!lang || (lang !== 'ID' && lang !== 'EN')) { 
                lang = 'ID'; 
                localStorage.setItem('sush_lang', 'ID'); 
            }
            
            var data = kontenBahasa[lang];
            if (!data) return;
            
            document.getElementById('navBtnProfile').innerText = data.navProfile;
            document.getElementById('navBtnList').innerText = data.navNavList;
            document.getElementById('btnLogout').innerText = data.navNavBtnLogout;
            document.getElementById('titleRiwayat').innerText = data.hubHistoryTitle; 
            document.getElementById('emptyChatText').innerText = data.hubEmptyChat;
            
            document.getElementById('mCreateTitle').innerText = data.mCreateTitle;
            document.getElementById('mCreateDesc').innerText = data.mCreateDesc;
            document.getElementById('mCreateCancel').innerText = data.mCreateCancel;
            document.getElementById('mCreateConfirm').innerText = data.mCreateConfirm;
            document.getElementById('mJoinTitle').innerText = data.mJoinTitle;
            document.getElementById('mJoinDesc').innerText = data.mJoinDesc;
            document.getElementById('mJoinCancel').innerText = data.mJoinCancel;
            document.getElementById('mJoinConfirm').innerText = data.mJoinConfirm;

            currentActiveMenu = null;
            const dropdown = document.getElementById('universalDropdown');
            if (dropdown) {
                dropdown.style.maxHeight = '0px';
                dropdown.classList.remove('active');
            }

            const currentTimestamp = new Date().getTime();
            const boundaryISOString = new Date(currentTimestamp - 24 * 60 * 60 * 1000).toISOString();
            const purgeEndpointUrl = SUPABASE_URL + '/rest/v1/messages?created_at=lt.' + encodeURIComponent(boundaryISOString);
            fetch(purgeEndpointUrl, { method: 'DELETE', headers: reqHeaders }).catch(err => console.error(err));

            renderHubList();
            cekSemuaNotifikasi();
        }


        function logoutSistem() { 
            if (typeof notifIntervalId !== 'undefined' && notifIntervalId) {
                clearInterval(notifIntervalId);
                notifIntervalId = null;
            }
            if (typeof chatIntervalId !== 'undefined' && chatIntervalId) {
                clearInterval(chatIntervalId);
                chatIntervalId = null;
            }
            localStorage.removeItem('sush_curUser'); 
            localStorage.removeItem('sush_curEmail'); 
            localStorage.removeItem('sush_curAlias');
            window.location.href = 'index.html';
        }

        function bukaModal(id) { 
            const m = document.getElementById(id);
            if(m) m.style.display = 'flex'; 
        }
        
        function tutupModal(id) { 
            const m = document.getElementById(id);
            if(m) m.style.display = 'none'; 
            const nInput = document.getElementById('groupNameInput');
            if(nInput) nInput.value = ''; 
            const pInput = document.getElementById('groupPassInput');
            if(pInput) pInput.value = ''; 
            const jInput = document.getElementById('joinPassInput');
            if(jInput) jInput.value = ''; 
        }

        function bukaChatRoom(id) {
            localStorage.setItem('sush_activeGroup', id);
            if (typeof navigasiKeHalaman === 'function') {
                navigasiKeHalaman('chat.html', 'slide-out-left');
            } else {
                window.location.href = 'chat.html';
            }
        }
                    async function simulasiCariGrup() { 
            let searchVal = document.getElementById('searchSecretId');
            if(!searchVal) return;
            searchVal = searchVal.value.trim();
            const lang = localStorage.getItem('sush_lang') || 'ID';
            
            if(!searchVal) return;

            if (searchVal.includes('bit.ly') || searchVal.includes('?g=')) {
                try {
                    let base64Token = '';
                    if (searchVal.includes('?g=')) {
                        base64Token = searchVal.split('?g=')[1];
                    } else {
                        base64Token = searchVal;
                    }

                    if (base64Token) {
                        const decodedStr = decodeURIComponent(escape(atob(base64Token)));
                        const parts = decodedStr.split('|');
                        if (parts.length === 2) {
                            localStorage.setItem('sush_pendingJoin', JSON.stringify({ name: parts[0], id: parts[1] }));
                            document.getElementById('searchSecretId').value = '';
                            
                            if (typeof cekSemuaNotifikasi === 'function') {
                                cekSemuaNotifikasi();
                            }
                            
                            if (currentActiveMenu !== 'notif' && typeof toggleMenuPanel === 'function') {
                                toggleMenuPanel('notif');
                            }
                            return;
                        }
                    }
                    throw new Error();
                } catch (e) {
                    alert(lang === 'ID' ? 'Format tautan undangan tidak valid!' : 'Invalid invite link format!');
                    return;
                }
            }

            try {
                const urlCekUser = SUPABASE_URL + '/rest/v1/users?or=(global_alias.eq.' + encodeURIComponent(searchVal) + ',username.eq.' + encodeURIComponent(searchVal) + ')';
                const resCekUser = await fetch(urlCekUser, { method: 'GET', headers: reqHeaders });
                const dataUser = await resCekUser.json();

                if (dataUser && dataUser.length > 0) {
                    const targetUser = dataUser[0];
                    if (targetUser.global_alias === localStorage.getItem('sush_curAlias') || targetUser.email === localStorage.getItem('sush_curEmail')) {
                        alert(lang === 'ID' ? 'Kamu tidak bisa menambah akun serumah sendiri!' : 'You cannot add your own ID!');
                        return;
                    }

                    const targetEmail = targetUser.email;
                    const targetAlias = targetUser.global_alias;
                    const myEmail = localStorage.getItem('sush_curEmail');
                    const myAlias = localStorage.getItem('sush_curAlias');

                    const urlCekDup = SUPABASE_URL + '/rest/v1/groups?password=eq.dm_pending';
                    const resCekDup = await fetch(urlCekDup, { method: 'GET', headers: reqHeaders });
                    const allPending = await resCekDup.json();
                    
                    const isExistPending = allPending.find(g => 
                        g.members.find(m => m.email === myEmail) && g.members.find(m => m.email === targetEmail)
                    );

                    if (isExistPending) {
                        alert(lang === 'ID' ? 'Permintaan pertemanan sudah dikirim sebelumnya. Harap menunggu konfirmasi.' : 'Friend request already sent. Please wait for confirmation.');
                        return;
                    }

                    const urlCekActive = SUPABASE_URL + '/rest/v1/groups?password=eq.dm_active';
                    const resCekActive = await fetch(urlCekActive, { method: 'GET', headers: reqHeaders });
                    const allActive = await resCekActive.json();
                    
                    const isAlreadyFriend = allActive.find(g => 
                        g.members.find(m => m.email === myEmail) && g.members.find(m => m.email === targetEmail)
                    );

                    if (isAlreadyFriend) {
                        alert(lang === 'ID' ? 'Akun yang anda maksud, sudah ada di pertemanan anda.' : 'The account you mean is already in your friends list.');
                        return;
                    }

                    const randomID = 'DM' + Math.floor(1000 + Math.random() * 9000).toString(16).toUpperCase();
                    const urlPost = SUPABASE_URL + '/rest/v1/groups';
                    await fetch(urlPost, {
                        method: 'POST',
                        headers: Object.assign({}, reqHeaders, { 'Prefer': 'return=representation' }),
                        body: JSON.stringify({
                            id: randomID,
                            name: 'DM_ROOM',
                            password: 'dm_pending',
                            members: [
                                { email: myEmail, alias: myAlias, creator: true },
                                { email: targetEmail, alias: targetAlias, creator: false }
                            ]
                        })
                    });

                    alert(lang === 'ID' ? 'Akun berhasil ditemukan. Mohon menunggu konfirmasi.' : 'Account found successfully. Please wait for confirmation.');
                    document.getElementById('searchSecretId').value = '';
                } else {
                    if (searchVal.includes('#')) {
                        alert(lang === 'ID' ? 'ID Pengguna tidak ditemukan di radar rahasia!' : 'Secret User ID not found in radar!');
                        return;
                    }

                    const cleanGroupId = searchVal.replace('#', '');
                    localStorage.setItem('sush_pendingJoin', JSON.stringify({ name: 'Grup Rahasia', id: cleanGroupId }));
                    
                    if (typeof cekSemuaNotifikasi === 'function') {
                        cekSemuaNotifikasi();
                    }
                    
                    if (currentActiveMenu !== 'notif' && typeof toggleMenuPanel === 'function') {
                        toggleMenuPanel('notif');
                    }
                }
            } catch (err) {
                alert('System Error: ' + err.message);
            }
        }

        async function prosesBuatGrup() {
            const groupName = document.getElementById('groupNameInput').value.trim(); 
            const groupPass = document.getElementById('groupPassInput').value;
            const lang = localStorage.getItem('sush_lang') || 'ID';
            
            if(!groupName || !groupPass) {
                alert(lang === 'ID' ? 'Nama grup dan password wajib diisi!' : 'Group name and password are required!');
                return;
            }
            tutupModal('modalCreate'); 
            
            const generatedGroupAlias = `${anonNouns[Math.floor(Math.random() * anonNouns.length)]}#${generateSecretPin()}`;
            const myEmail = localStorage.getItem('sush_curEmail');
            
            try {
                let randomID = '';
                let isUnique = false;
                
                while (!isUnique) {
                    randomID = 'GR' + Math.floor(100000 + Math.random() * 900000).toString(16).toUpperCase() + Math.floor(10 + Math.random() * 89).toString();
                    const urlCheck = SUPABASE_URL + '/rest/v1/groups?id=eq.' + encodeURIComponent(randomID);
                    const resCheck = await fetch(urlCheck, { method: 'GET', headers: reqHeaders });
                    const checkData = await resCheck.json();
                    
                    if (!checkData || checkData.length === 0) {
                        isUnique = true;
                    }
                }

                const urlPost = SUPABASE_URL + '/rest/v1/groups';
                const postHeaders = Object.assign({}, reqHeaders, { 'Prefer': 'return=representation' });
                
                const response = await fetch(urlPost, {
                    method: 'POST',
                    headers: postHeaders,
                    body: JSON.stringify({
                        id: randomID,
                        name: groupName,
                        password: groupPass,
                        members: [{ email: myEmail, alias: generatedGroupAlias, creator: true }],
                        pending_votes: []
                    })
                });

                if (!response.ok) {
                    throw new Error(lang === 'ID' ? 'Gagal mendaftarkan grup ke database!' : 'Failed to register group to database!');
                }

                setTimeout(() => {
                    bukaChatRoom(randomID);
                }, 100);

            } catch (err) {
                alert('System Error: ' + err.message);
            }
        }

        async function prosesKetukPintu(keputusan) {
            const pendingStr = localStorage.getItem('sush_pendingJoin');
            if(!pendingStr) return;
            
            const pending = JSON.parse(pendingStr);
            const lang = localStorage.getItem('sush_lang') || 'ID';
            
            if(keputusan === 'tidak') {
                localStorage.removeItem('sush_pendingJoin');
                alert(lang === 'ID' ? 'Akses dibatalkan.' : 'Access cancelled.');
                cekSemuaNotifikasi();
                return;
            }
            
            try {
                const safeId = pending.id.replace('#', '');
                const myEmail = localStorage.getItem('sush_curEmail');
                const myAlias = localStorage.getItem('sush_curAlias');
                
                const urlRpc = SUPABASE_URL + '/rest/v1/rpc/rpc_ketuk_pintu';
                const response = await fetch(urlRpc, {
                    method: 'POST',
                    headers: reqHeaders,
                    body: JSON.stringify({
                        p_group_id: safeId,
                        p_user_email: myEmail,
                        p_user_alias: myAlias
                    })
                });

                if (!response.ok) {
                    throw new Error('RPC endpoint failed to respond.');
                }

                const result = await response.json();
                
                if (result.success) {
                    alert(lang === 'ID' ? 'Permintaan bergabung dikirim ke admin grup.' : 'Join request sent to group admins.');
                } else {
                    if (result.message === 'Already a member') {
                        alert(lang === 'ID' ? 'Anda sudah berada di dalam grup ini.' : 'You are already in this group.');
                    } else if (result.message === 'Request already pending') {
                        alert(lang === 'ID' ? 'Permintaan Anda sudah dalam antrean sebelumnya.' : 'Your request is already pending.');
                    } else {
                        alert(result.message);
                    }
                }
                
                localStorage.removeItem('sush_pendingJoin');
                cekSemuaNotifikasi();
            } catch (err) {
                alert('System Error: ' + err.message);
            }
        }

        async function prosesVote(targetEmail, roomId, setuju) {
            try {
                const myEmail = localStorage.getItem('sush_curEmail');
                const urlRpc = SUPABASE_URL + '/rest/v1/rpc/rpc_proses_vote';
                const response = await fetch(urlRpc, {
                    method: 'POST',
                    headers: reqHeaders,
                    body: JSON.stringify({
                        p_group_id: roomId,
                        p_target_email: targetEmail,
                        p_voter_email: myEmail,
                        p_is_setuju: setuju
                    })
                });

                if (!response.ok) {
                    throw new Error('RPC endpoint failed to respond.');
                }
                const result = await response.json();
                if (result.success) { console.log(result.message); } else { console.warn(result.message); }
                cekSemuaNotifikasi();
            } catch (err) {
                console.error('System Error: ' + err.message);
            }
       }

        async function renderHubList() {
            const hubList = document.getElementById('hubChatList');
            const lang = localStorage.getItem('sush_lang') || 'ID';
            const myEmail = localStorage.getItem('sush_curEmail');
            
            try {
                const urlGroups = SUPABASE_URL + '/rest/v1/groups?select=*';
                const resGroups = await fetch(urlGroups, { method: 'GET', headers: reqHeaders });
                const allGroups = await resGroups.json();
                
                const myGroups = allGroups.filter(g => g.password !== 'dm_pending' && g.members && g.members.find(m => m.email === myEmail));
                
                if(myGroups.length === 0) {
                    const emptyHTML = `<div class="empty-state">${kontenBahasa[lang].hubEmptyChat}</div>`;
                    if (hubList.innerHTML !== emptyHTML) hubList.innerHTML = emptyHTML;
                    return;
                }
                
                const urlMsgs = SUPABASE_URL + '/rest/v1/messages?select=*';
                const resMsgs = await fetch(urlMsgs, { method: 'GET', headers: reqHeaders });
                const allMsgs = await resMsgs.json();
                
                const now = new Date().getTime();
                
                myGroups.forEach(g => {
                    const gMsgs = allMsgs.filter(m => m.group_id === g.id);
                    let latestTime = 0;
                    if (gMsgs.length > 0) {
                        latestTime = Math.max(...gMsgs.map(m => new Date(m.created_at).getTime()));
                    }
                    g.latestMsgTime = latestTime;
                    g.cachedMsgs = gMsgs;
                });

                myGroups.sort((a, b) => b.latestMsgTime - a.latestMsgTime);
                
                let html = '';
                
                myGroups.forEach(g => {
                    let cNew = 0, cAge = 0, cFade = 0;
                    
                    g.cachedMsgs.forEach(msg => {
                        const msgTime = new Date(msg.created_at).getTime();
                        const diffHours = (now - msgTime) / 3600000;
                        
                        if(diffHours < 24) {
                            if(diffHours < 9) cNew++; 
                            else if(diffHours < 22) cAge++; 
                            else cFade++; 
                        }
                    });
                    
                    let indicators = '';
                    if(cNew > 0) indicators += ` <span class="neon-dot dot-green">•</span> ${cNew}`;
                    if(cAge > 0) indicators += ` <span class="neon-dot dot-yellow">•</span> ${cAge}`;
                    if(cFade > 0) indicators += ` <span class="neon-dot dot-red">•</span> ${cFade}`;
                    
                    const subtext = lang === 'ID' ? 'Ketuk untuk membuka obrolan rahasia.' : 'Tap to open secret chat.';
                    
                    html += `
                        <div class="vibe-box" style="cursor:pointer; margin-bottom: 10px;" onclick="bukaChatRoom('${g.id}')">
                            <h4 style="margin: 0; color: #45f3ff;">${g.name}${indicators}</h4>
                            <p style="font-size: 0.8rem; color: #a0a0a0; margin-top: 5px;">${subtext}</p>
                        </div>
                    `;
                });
                
                if (hubList.innerHTML !== html) hubList.innerHTML = html;
            } catch (err) {
                const errHTML = `<div class="empty-state">System Error: ${err.message}</div>`;
                if (hubList.innerHTML !== errHTML) hubList.innerHTML = errHTML;
            }
            }
                    async function cekSemuaNotifikasi() {
            const myEmail = localStorage.getItem('sush_curEmail');
            const badge = document.getElementById('titleBadge');
            const listContainer = document.getElementById('notifList');
            const lang = localStorage.getItem('sush_lang') || 'ID';
            
            if(!myEmail) return;

            let html = '';
            let hasNotif = false;

            const pendingStr = localStorage.getItem('sush_pendingJoin');
            if (pendingStr) {
                hasNotif = true;
                const pending = JSON.parse(pendingStr);
                const txt = lang === 'ID' 
                    ? `Apakah Anda ingin bergabung ke grup <strong>${pending.name}</strong>?` 
                    : `Do you want to join the group <strong>${pending.name}</strong>?`;
                const btnY = lang === 'ID' ? 'YA' : 'YES';
                const btnN = lang === 'ID' ? 'TIDAK' : 'NO';
                
                html += `
                    <div class="notif-item" style="margin-bottom: 10px;">
                        <div class="notif-text">${txt}</div>
                        <div class="notif-bars">
                            <div class="notif-btns">
                                <button class="btn-notif-accept" onclick="prosesKetukPintu('ya')">${btnY}</button>
                                <button class="btn-notif-reject" onclick="prosesKetukPintu('tidak')">${btnN}</button>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            try {
                const urlGroups = SUPABASE_URL + '/rest/v1/groups?select=*';
                const resGroups = await fetch(urlGroups, { method: 'GET', headers: reqHeaders });
                const allGroups = await resGroups.json();
                
                if (allGroups && allGroups.length > 0) {
                    const dmRequests = allGroups.filter(g => 
                        g.password === 'dm_pending' && 
                        g.members && g.members.find(m => m.email === myEmail && m.creator === false)
                    );

                    dmRequests.forEach(req => {
                        hasNotif = true;
                        const pengirimData = req.members.find(m => m.creator === true);
                        const namaPengirimClean = pengirimData ? pengirimData.alias.split('#')[0] : 'Unknown';
                        const txt = lang === 'ID' 
                            ? `User <strong>${namaPengirimClean}</strong> menambahkan anda menjadi teman.` 
                            : `User <strong>${namaPengirimClean}</strong> added you as a friend.`;
                        const btnAcc = lang === 'ID' ? 'TERIMA' : 'ACCEPT';
                        const btnRej = lang === 'ID' ? 'TOLAK' : 'REJECT';

                        html += `
                            <div class="notif-item" style="margin-bottom: 10px;">
                                <div class="notif-text">${txt}</div>
                                <div class="notif-bars">
                                    <div class="notif-btns">
                                        <button class="btn-notif-accept" onclick="aksiPermintaan('${req.id}', 'terima')">${btnAcc}</button>
                                        <button class="btn-notif-reject" onclick="aksiPermintaan('${req.id}', 'tolak')">${btnRej}</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    allGroups.forEach(g => {
                        if (g.password !== 'dm_pending' && g.password !== 'dm_active' && g.members && g.members.find(m => m.email === myEmail)) {
                            if (g.pending_votes && g.pending_votes.length > 0) {
                                g.pending_votes.forEach(pv => {
                                    if (!pv.type || pv.type === 'join') {
                                        const vBy = pv.voted_by || [];
                                        const rBy = pv.rejected_by || [];
                                        
                                        if (!vBy.includes(myEmail) && !rBy.includes(myEmail)) {
                                            hasNotif = true;
                                            const namaCalonClean = pv.alias.split('#')[0];
                                            const txt = lang === 'ID' ? `Izinkan <strong>${namaCalonClean}</strong> bergabung ke <strong>${g.name}</strong>?` : `Allow <strong>${namaCalonClean}</strong> to join <strong>${g.name}</strong>?`;
                                            const btnAcc = lang === 'ID' ? 'TERIMA' : 'ACCEPT';
                                            const btnRej = lang === 'ID' ? 'TOLAK' : 'REJECT';

                                            html += `
                                                <div class="notif-item" style="margin-bottom: 10px;">
                                                    <div class="notif-text">${txt}</div>
                                                    <div class="notif-bars">
                                                        <div class="notif-btns">
                                                            <button class="btn-notif-accept" onclick="prosesVote('${pv.email}', '${g.id}', true)">${btnAcc}</button>
                                                            <button class="btn-notif-reject" onclick="prosesVote('${pv.email}', '${g.id}', false)">${btnRej}</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            `;
                                        }
                                    }
                                });

                                g.pending_votes.forEach(pv => {
                                    if (pv.type === 'exile') {
                                        const vBy = pv.voted_by || [];
                                        const rBy = pv.rejected_by || [];
                                        
                                        if (!vBy.includes(myEmail) && !rBy.includes(myEmail)) {
                                            hasNotif = true;
                                            const txtExileVote = kontenBahasa[lang].lblExileVote || 'ingin mengeluarkan';
                                            const txtExileFrom = kontenBahasa[lang].lblExileFrom || 'dari grup';
                                            const btnAcc = lang === 'ID' ? 'TERIMA' : 'ACCEPT';
                                            const btnRej = lang === 'ID' ? 'TOLAK' : 'REJECT';
                                            
                                            const namaPemicuClean = pv.triggered_by_alias.split('#')[0];
                                            const namaTargetClean = pv.target_alias.split('#')[0];
                                            const kalimatSopan = `<strong>${namaPemicuClean}</strong> ${txtExileVote} <strong>${namaTargetClean}</strong> ${txtExileFrom} <strong>${g.name}</strong>.`;

                                            html += `
                                                <div class="notif-item" style="margin-bottom: 10px;">
                                                    <div class="notif-text">${kalimatSopan}</div>
                                                    <div class="notif-bars">
                                                        <div class="notif-btns">
                                                            <button class="btn-notif-accept" onclick="prosesVoteExile('${pv.target_email}', '${g.id}', true)">${btnAcc}</button>
                                                            <button class="btn-notif-reject" onclick="prosesVoteExile('${pv.target_email}', '${g.id}', false)">${btnRej}</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            `;
                                        }
                                    }
                                });
                            }
                        }
                    });
                }

                
                if (listContainer) {
                    if (html === '') {
                        const emptyHTML = `<div class="empty-state">${lang === 'ID' ? 'Tidak ada notifikasi baru.' : 'No new notifications.'}</div>`;
                        if (listContainer.innerHTML !== emptyHTML) listContainer.innerHTML = emptyHTML;
                    } else {
                        if (listContainer.innerHTML !== html) listContainer.innerHTML = html;
                    }
                }
                
                if (badge) {
                    if (hasNotif) {
                        if (badge.className !== "neon-dot dot-yellow") badge.className = "neon-dot dot-yellow";
                        if (badge.style.display !== 'inline-block') badge.style.display = 'inline-block';
                    } else {
                        if (badge.style.display !== 'none') badge.style.display = 'none';
                    }
                }

                const dropdown = document.getElementById('universalDropdown');
                if(dropdown && currentActiveMenu === 'notif') {
                    const cBox = document.getElementById('universalDropdownContent');
                    dropdown.style.maxHeight = (cBox.scrollHeight + 30) + 'px';
                }
                
            } catch (err) {
                console.error('System Error: ' + err.message);
            }
        }

        function toggleMenuPanel(jenisMenu) {
            const dropdown = document.getElementById('universalDropdown');
            const contentBox = document.getElementById('universalDropdownContent');
            const lang = localStorage.getItem('sush_lang') || 'ID';
            
            if (!dropdown || !contentBox) return;

            if (currentActiveMenu === jenisMenu) {
                dropdown.style.maxHeight = '0';
                dropdown.classList.remove('active');
                currentActiveMenu = null;
                return;
            }

            let htmlBaru = '';

            if (jenisMenu === 'profile') {
                const myUser = localStorage.getItem('sush_curUser') || 'Unknown';
                const myAlias = localStorage.getItem('sush_curAlias') || 'Anon#XXXXXX';
                const myEmail = localStorage.getItem('sush_curEmail') || 'unknown@mail.com';
                
                const labelUser = lang === 'ID' ? 'Username:' : 'Username:';
                const labelAlias = lang === 'ID' ? 'Nama Samaran:' : 'Alias:';
                const labelEmail = lang === 'ID' ? 'Email:' : 'Email:';

                htmlBaru = `
                    <div class="profile-bar">
                        <div class="profile-item"><span>${labelUser}</span> <span>${myUser}</span></div>
                        <div class="profile-item"><span>${labelAlias}</span> <span>${myAlias}</span></div>
                        <div class="profile-item"><span>${labelEmail}</span> <span>${myEmail}</span></div>
                    </div>
                `;
            } 
            else if (jenisMenu === 'action') {
                const txtCari = lang === 'ID' ? 'Cari Secret ID (Contoh: Panda#9X2B)...' : 'Search Secret ID (Ex: Panda#9X2B)...';
                const txtGrup = lang === 'ID' ? '+ Buat Grup Rahasia Baru' : '+ Create New Secret Group';
                const txtBtnCari = lang === 'ID' ? 'Cari' : 'Search';
                
                htmlBaru = `
                    <button class="btn-create-group" onclick="bukaModal('modalCreate')">${txtGrup}</button>
                    <div class="search-box">
                        <input type="text" id="searchSecretId" class="input-field" placeholder="${txtCari}" autocomplete="off">
                        <button class="btn-search" onclick="simulasiCariGrup()">${txtBtnCari}</button>
                    </div>
                `;
            } 
            else if (jenisMenu === 'list') {
                htmlBaru = `<div id="friendListContainer">Memuat daftar teman...</div>`;
                setTimeout(() => renderFriendList(), 50); 
            }
            else if (jenisMenu === 'notif') {
                htmlBaru = `<div id="notifList"></div>`;
                setTimeout(() => cekSemuaNotifikasi(), 50); 
            }

            contentBox.innerHTML = htmlBaru;
            dropdown.classList.add('active');
            
            const totalHeight = contentBox.scrollHeight + 30; 
            dropdown.style.maxHeight = totalHeight + 'px';
            currentActiveMenu = jenisMenu;
        }

        function togglePinFriend(roomId, event) {
            if (event) event.stopPropagation();
            let pinned = [];
            try {
                pinned = JSON.parse(localStorage.getItem('sush_pinnedFriends')) || [];
            } catch (e) {
                pinned = [];
            }
            
            if (pinned.includes(roomId)) {
                pinned = pinned.filter(id => id !== roomId);
            } else {
                pinned.push(roomId);
            }
            localStorage.setItem('sush_pinnedFriends', JSON.stringify(pinned));
            renderFriendList();
        }

        async function renderFriendList() {
            const container = document.getElementById('friendListContainer');
            if(!container) return;
            
            const myEmail = localStorage.getItem('sush_curEmail');
            const lang = localStorage.getItem('sush_lang') || 'ID';
            
            try {
                const urlGroups = SUPABASE_URL + '/rest/v1/groups?password=eq.dm_active&select=*';
                const resGroups = await fetch(urlGroups, { method: 'GET', headers: reqHeaders });
                const allGroups = await resGroups.json();
                
                const myDMs = allGroups.filter(g => g.members && g.members.find(m => m.email === myEmail));
                
                if (myDMs.length === 0) {
                    container.innerHTML = `<div style="font-size:0.8rem; color:#a0a0a0; text-align:center; padding:10px;">${lang === 'ID' ? 'Belum ada teman terdaftar.' : 'No friends listed yet.'}</div>`;
                    return;
                }
                
                const urlMsgs = SUPABASE_URL + '/rest/v1/messages?select=*';
                const resMsgs = await fetch(urlMsgs, { method: 'GET', headers: reqHeaders });
                const allMsgs = await resMsgs.json();
                
                const now = new Date().getTime();
                let temanList = [];
                
                myDMs.forEach(dm => {
                    const temanObj = dm.members.find(m => m.email !== myEmail);
                    if(temanObj) {
                        const roomMsgs = allMsgs.filter(m => m.group_id === dm.id);
                        let latestTime = 0;
                        if (roomMsgs.length > 0) {
                            latestTime = Math.max(...roomMsgs.map(m => new Date(m.created_at).getTime()));
                        }
                        
                        temanList.push({ 
                            alias: temanObj.alias, 
                            roomId: dm.id,
                            latestMsgTime: latestTime
                        });
                    }
                });
                
                let pinnedIds = [];
                try {
                    pinnedIds = JSON.parse(localStorage.getItem('sush_pinnedFriends')) || [];
                } catch (e) {
                    pinnedIds = [];
                }
                
                let pinnedPasukan = [];
                let regulerPasukan = [];
                
                temanList.forEach(t => {
                    if (pinnedIds.includes(t.roomId)) {
                        pinnedPasukan.push(t);
                    } else {
                        regulerPasukan.push(t);
                    }
                });
                
                pinnedPasukan.sort((a, b) => {
                    const partsA = a.alias.split('#');
                    const partsB = b.alias.split('#');
                    const namaA = partsA[0].toLowerCase();
                    const namaB = partsB[0].toLowerCase();
                    if (namaA < namaB) return -1;
                    if (namaA > namaB) return 1;
                    const numA = parseInt(partsA[1], 10) || 0;
                    const numB = parseInt(partsB[1], 10) || 0;
                    return numA - numB;
                });

                regulerPasukan.sort((a, b) => {
                    const partsA = a.alias.split('#');
                    const partsB = b.alias.split('#');
                    const namaA = partsA[0].toLowerCase();
                    const namaB = partsB[0].toLowerCase();
                    if (namaA < namaB) return -1;
                    if (namaA > namaB) return 1;
                    const numA = parseInt(partsA[1], 10) || 0;
                    const numB = parseInt(partsB[1], 10) || 0;
                    return numA - numB;
                });
                
                let htmlList = '';
                
                if (pinnedPasukan.length > 0) {
                    htmlList += `<div class="divider-text" style="border-bottom: 1px solid #45f3ff; font-weight: bold; padding-bottom: 2px;">📌 PINNED</div>`;
                    pinnedPasukan.forEach(t => {
                        let indicator = '';
                        if (t.latestMsgTime > 0) {
                            const diffHours = (now - t.latestMsgTime) / 3600000;
                            if (diffHours < 24) {
                                if (diffHours < 9) indicator = ` <span class="neon-dot dot-green">•</span>`;
                                else if (diffHours < 22) indicator = ` <span class="neon-dot dot-yellow">•</span>`;
                                else indicator = ` <span class="neon-dot dot-red">•</span>`;
                            }
                        }
                        
                        htmlList += `
                            <div class="list-item-friend" onclick="bukaChatRoom('${t.roomId}')" style="margin-bottom: 5px; border-left: 3px solid #ffd700;">
                                <span class="list-friend-name">${t.alias}${indicator}</span>
                                <div style="display: flex; align-items: center; gap: 15px;">
                                    <span onclick="togglePinFriend('${t.roomId}', event)" style="cursor: pointer; font-size: 0.85rem; color: #ff4a4a; font-weight: bold;">UNPIN</span>
                                    <span style="color:#45f3ff; font-size:1.2rem;">--></span>
                                </div>
                            </div>
                        `;
                    });
                }
                
                let currentAbjadMarker = '';
                regulerPasukan.forEach(t => {
                    const firstLetter = t.alias.charAt(0).toUpperCase();
                    if (firstLetter !== currentAbjadMarker) {
                        currentAbjadMarker = firstLetter;
                        htmlList += `<div class="divider-text" style="margin-top: 10px; font-weight: bold;">${currentAbjadMarker}</div>`;
                    }
                    
                    let indicator = '';
                    if (t.latestMsgTime > 0) {
                        const diffHours = (now - t.latestMsgTime) / 3600000;
                        if (diffHours < 24) {
                            if (diffHours < 9) indicator = ` <span class="neon-dot dot-green">•</span>`;
                            else if (diffHours < 22) indicator = ` <span class="neon-dot dot-yellow">•</span>`;
                            else indicator = ` <span class="neon-dot dot-red">•</span>`;
                        }
                    }
                    
                    htmlList += `
                        <div class="list-item-friend" onclick="bukaChatRoom('${t.roomId}')" style="margin-bottom: 5px;">
                            <span class="list-friend-name">${t.alias}${indicator}</span>
                            <div style="display: flex; align-items: center; gap: 15px;">
                                <span onclick="togglePinFriend('${t.roomId}', event)" style="cursor: pointer; font-size: 0.85rem; color: #45f3ff; font-weight: bold;">PIN</span>
                                <span style="color:#45f3ff; font-size:1.2rem;">--></span>
                            </div>
                        </div>
                    `;
                });
                
                const newHTML = `<div style="display:flex; flex-direction:column; gap:5px;">${htmlList}</div>`;
                if (container.innerHTML !== newHTML) container.innerHTML = newHTML;
                
                const dropdown = document.getElementById('universalDropdown');
                if(dropdown && currentActiveMenu === 'list') {
                    const cBox = document.getElementById('universalDropdownContent');
                    dropdown.style.maxHeight = (cBox.scrollHeight + 30) + 'px';
                }
                
            } catch (err) {
                container.innerHTML = `<div style="font-size:0.8rem; color:#ff4a4a; text-align:center; padding:10px;">Error: ${err.message}</div>`;
            }
        }

        async function prosesVoteExile(targetEmail, roomId, setuju) {
            try {
                const myEmail = localStorage.getItem('sush_curEmail');
                
                const urlGroup = SUPABASE_URL + '/rest/v1/groups?id=eq.' + encodeURIComponent(roomId);
                const resGroup = await fetch(urlGroup, { method: 'GET', headers: reqHeaders });
                const groupData = await resGroup.json();

                if (!groupData || groupData.length === 0) return;
                const g = groupData[0];
                let pendingVotes = g.pending_votes || [];
                let members = g.members || [];

                let currentVote = pendingVotes.find(pv => pv.type === 'exile' && pv.target_email === targetEmail);
                if (!currentVote) return;

                if (setuju) {
                    if (!currentVote.voted_by.includes(myEmail)) {
                        currentVote.voted_by.push(myEmail);
                    }
                } else {
                    if (!currentVote.rejected_by.includes(myEmail)) {
                        currentVote.rejected_by.push(myEmail);
                    }
                }

                const kuorumMayoritas = Math.floor(members.length / 2) + 1;

                if (currentVote.voted_by.length >= kuorumMayoritas) {
                    members = members.filter(m => m.email !== targetEmail);
                    pendingVotes = pendingVotes.filter(pv => !(pv.type === 'exile' && pv.target_email === targetEmail));
                } else if (currentVote.rejected_by.length >= kuorumMayoritas) {
                    pendingVotes = pendingVotes.filter(pv => !(pv.type === 'exile' && pv.target_email === targetEmail));
                }

                const urlPatch = SUPABASE_URL + '/rest/v1/groups?id=eq.' + encodeURIComponent(roomId);
                await fetch(urlPatch, {
                    method: 'PATCH',
                    headers: Object.assign({}, reqHeaders, { 'Prefer': 'return=representation' }),
                    body: JSON.stringify({ members: members, pending_votes: pendingVotes })
                });

                cekSemuaNotifikasi();
                renderHubList();
            } catch (err) {
                console.error('Exile Vote Error: ' + err.message);
            }
        }

            
        async function aksiPermintaan(roomId, tipe) {
            const lang = localStorage.getItem('sush_lang') || 'ID';
            toggleMenuPanel('notif'); 
            try {
                if (tipe === 'tolak') {
                    const urlDel = SUPABASE_URL + '/rest/v1/groups?id=eq.' + encodeURIComponent(roomId);
                    await fetch(urlDel, { method: 'DELETE', headers: reqHeaders });
                    alert(lang === 'ID' ? 'Permintaan ditolak.' : 'Request rejected.');
                } else {
                    const urlGet = SUPABASE_URL + '/rest/v1/groups?id=eq.' + encodeURIComponent(roomId);
                    const resGet = await fetch(urlGet, { method: 'GET', headers: reqHeaders });
                    const resData = await resGet.json();
                    if(!resData || resData.length === 0) return;

                    const room = resData[0];
                    const creatorMem = room.members.find(m => m.creator === true);
                    const receiverMem = room.members.find(m => m.creator === false);
                    const cleanCreatorName = creatorMem ? creatorMem.alias.split('#')[0] : 'Unknown';
                    const cleanReceiverName = receiverMem ? receiverMem.alias.split('#')[0] : 'Unknown';
                    const customRoomName = `${cleanCreatorName} & ${cleanReceiverName}`;

                    const urlPatch = SUPABASE_URL + '/rest/v1/groups?id=eq.' + encodeURIComponent(roomId);
                    await fetch(urlPatch, {
                        method: 'PATCH',
                        headers: Object.assign({}, reqHeaders, { 'Prefer': 'return=representation' }),
                        body: JSON.stringify({ name: customRoomName, password: 'dm_active' })
                    });
                    alert(lang === 'ID' ? 'Jalur chat personal berhasil terbentuk!' : 'Direct message room established successfully!');
                }
                cekSemuaNotifikasi();
                renderHubList(); 
            } catch (err) { alert('System Error: ' + err.message); }
        }

        function cekPermintaanPertemanan() {
            if (currentActiveMenu === 'notif') {
                cekSemuaNotifikasi();
            } else {
                cekBadgeNotifikasi();
            }
        }
        
        async function cekBadgeNotifikasi() {
            const myEmail = localStorage.getItem('sush_curEmail');
            const badge = document.getElementById('titleBadge');
            if(!myEmail || !badge) return;
            
            try {
                const pendingStr = localStorage.getItem('sush_pendingJoin');
                let hasLocalNotif = pendingStr ? true : false;

                const urlGetDM = SUPABASE_URL + '/rest/v1/groups?password=eq.dm_pending';
                const resDM = await fetch(urlGetDM, { method: 'GET', headers: reqHeaders });
                const dataDM = await resDM.json();

                const requestsForMe = dataDM.filter(g => 
                    g.members && g.members.find(m => m.email === myEmail && m.creator === false)
                );

                const urlGetGroups = SUPABASE_URL + '/rest/v1/groups?select=*';
                const resGroups = await fetch(urlGetGroups, { method: 'GET', headers: reqHeaders });
                const dataGroups = await resGroups.json();
                
                let voteRequestsCount = 0;
                dataGroups.forEach(g => {
                    if (g.members && g.members.find(m => m.email === myEmail)) {
                        if (g.pending_votes && g.pending_votes.length > 0) {
                            g.pending_votes.forEach(pv => {
                                if (!pv.voted_by || !pv.voted_by.includes(myEmail)) {
                                    voteRequestsCount++;
                                }
                            });
                        }
                    }
                });

                if (hasLocalNotif || requestsForMe.length > 0 || voteRequestsCount > 0) {
                    if (badge.className !== "neon-dot dot-yellow") badge.className = "neon-dot dot-yellow";
                    if (badge.style.display !== 'inline-block') badge.style.display = 'inline-block';
                } else {
                    if (badge.style.display !== 'none') badge.style.display = 'none';
                }
            } catch(e) {}
        }
    </script>
